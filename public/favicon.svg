<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <title>GIGBOY - Music Songbook</title>
  
  <!-- Define gradients -->
  <defs>
    <linearGradient id="bookGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Binding rings on spine -->
  <circle cx="65" cy="60" r="8" fill="#0a0f1e" opacity="0.8"/>
  <circle cx="65" cy="100" r="8" fill="#0a0f1e" opacity="0.8"/>
  <circle cx="65" cy="140" r="8" fill="#0a0f1e" opacity="0.8"/>
  
  <!-- Book spine -->
  <rect x="60" y="40" width="10" height="120" fill="#0a0f1e"/>
  
  <!-- Book cover background -->
  <path d="M 75 40 L 220 40 Q 235 40 235 55 L 235 185 Q 235 200 220 200 L 75 200 Q 70 200 70 195 L 70 45 Q 70 40 75 40 Z" 
        fill="url(#bookGradient)" stroke="#0f172a" stroke-width="3"/>
  
  <!-- Left edge shadow for depth -->
  <path d="M 70 45 L 75 40 L 75 200 L 70 195 Z" fill="#0a0f1e" opacity="0.3"/>
  
  <!-- Music note on cover - positioned in center -->
  <g transform="translate(155, 110)">
    <!-- Note head (filled circle/oval) -->
    <ellipse cx="0" cy="32" rx="16" ry="20" fill="#f97316"/>
    
    <!-- Stem -->
    <line x1="14" y1="-15" x2="14" y2="55" stroke="#f97316" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Flag/beam on stem -->
    <path d="M 19 -15 Q 50 0 50 20 L 19 8 Z" fill="#f97316"/>
  </g>
  
  <!-- Decorative text lines on cover -->
  <line x1="95" y1="145" x2="215" y2="145" stroke="#ffffff" stroke-width="3" opacity="0.25" stroke-linecap="round"/>
  <line x1="95" y1="160" x2="215" y2="160" stroke="#ffffff" stroke-width="2" opacity="0.15" stroke-linecap="round"/>
  <line x1="95" y1="173" x2="200" y2="173" stroke="#ffffff" stroke-width="2" opacity="0.15" stroke-linecap="round"/>
  
  <!-- Cover shine/highlight -->
  <ellipse cx="120" cy="70" rx="35" ry="25" fill="#ffffff" opacity="0.08"/>
</svg>
