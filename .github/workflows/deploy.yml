name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy-rate-limiter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rate-limiter-do
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-app:
    runs-on: ubuntu-latest
    needs: deploy-rate-limiter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build:pages
      - run: npx wrangler pages deploy dist --project-name gigboy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
